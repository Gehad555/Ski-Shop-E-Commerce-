<header class="bg-white shadow-md p-3 w-full border-b border-gray-100">
  <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
    <img routerLink="/" src="/images/logo.png" alt="app logo" class="max-h-16 cursor-pointer">
    <nav class="flex gap-6 my-2 uppercase text-lg font-medium text-gray-700 tracking-wide">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="hover:text-blue-600 transition-colors duration-300 cursor-pointer">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="hover:text-blue-600 transition-colors duration-300 cursor-pointer">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active">Errors</a>
    </nav>
    <div class="flex gap-3 items-center">
      <a matBadge="5" matBadgeSize="large" class="custom-badge mt-2 mr-2 text-gray-700 cursor-pointer">
        <mat-icon class="text-gray-700">shopping_cart</mat-icon>
      </a>
      <button mat-stroked-button class="!border-blue-600 !text-blue-600 hover:!bg-blue-50">Login</button>
      <button mat-flat-button class="!bg-blue-600 !text-white hover:!bg-blue-700">Register</button>
    </div>
  </div>
</header>

@if (busyService.loading) {
  <mat-progress-bar class="fixed top-20 z-50" mode="indeterminate"></mat-progress-bar>
}
