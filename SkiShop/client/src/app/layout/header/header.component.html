<header class="bg-white shadow-md p-3 w-full border-b border-gray-100">
  <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
    <img src="/images/logo.png" alt="app logo" class="max-h-16">
    <nav class="flex gap-6 my-2 uppercase text-lg font-medium text-gray-700 tracking-wide">
      <a class="hover:text-blue-600 cursor-pointer transition-colors">Home</a>
      <a class="hover:text-blue-600 cursor-pointer transition-colors">Shop</a>
      <a class="hover:text-blue-600 cursor-pointer transition-colors">Contact</a>
    </nav>
    <div class="flex gap-3 items-center">
      <a matBadge="5" matBadgeSize="large" class="custom-badge mt-2 mr-2 text-gray-700 cursor-pointer">
        <mat-icon class="text-gray-700">shopping_cart</mat-icon>
      </a>
      <button mat-stroked-button class="!border-blue-600 !text-blue-600 hover:!bg-blue-50">Login</button>
      <button mat-flat-button class="!bg-blue-600 !text-white hover:!bg-blue-700">Register</button>
    </div>
  </div>
</header>
