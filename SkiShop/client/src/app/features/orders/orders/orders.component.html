<div class="mx-auto">
    <h2 class="font-semibold text-2xl text-center mb-4">My orders</h2>
    <div class="flex flex-col w-full overflow-x-auto rounded-xl border border-gray-200 shadow-sm bg-[var(--mat-sys-surface)]">
        <table class="divide-y divide-gray-300 w-full cursor-pointer">
            <thead class="bg-gray-50">
                <tr class="uppercase font-light text-sm">
                    <th class="text-center px-4 sm:px-6 py-3 whitespace-nowrap">Order</th>
                    <th class="text-left px-4 py-3 whitespace-nowrap">Date</th>
                    <th class="text-left px-4 py-3 whitespace-nowrap">Total</th>
                    <th class="text-left px-4 py-3 whitespace-nowrap">Status</th>
                </tr>
            </thead>
            <tbody class="bg-[var(--mat-sys-surface)] divide-y divide-gray-100">
                @for (order of orderService.ordersResource.value(); track order.id) {
                    <tr routerLink="/orders/{{order.id}}" class="hover:bg-gray-100">
                        <th class="px-4 sm:px-6 py-3 whitespace-nowrap"># {{order.id}}</th>
                        <td class="px-4 py-3 whitespace-nowrap">{{order.orderDate | date: 'medium'}}</td>
                        <td class="px-4 py-3 whitespace-nowrap">{{order.total | currency}}</td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <mat-chip
                                [ngClass]="{
                                    '!bg-green-100': order.status === 'PaymentReceived',
                                    '!bg-amber-100': order.status === 'Pending'
                                }"
                            >
                                {{order.status | splitCamelCase}}
                            </mat-chip>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
