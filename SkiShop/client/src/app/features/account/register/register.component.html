<mat-card class="max-w-lg mx-auto mt-8 p-8 bg-(--mat-sys-surface)!">
    <form (submit)="onSubmit($event)">
        <div class="flex justify-center mb-6 items-center">
            <h1 class="text-3xl font-semibold text-primary">Register</h1>
        </div>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>First name</mat-label>
            <input matInput [(ngModel)]="firstName" name="firstName" type="text" placeholder="John">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>Last name</mat-label>
            <input matInput [(ngModel)]="lastName" name="lastName" type="text" placeholder="Doe">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="email" name="email" type="email" placeholder="email@example.com">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>Password</mat-label>
            <input matInput [(ngModel)]="password" name="password" type="password" placeholder="password">
        </mat-form-field>

        @if (validationErrors().length > 0) {
            <div class="mb-3 -mt-6 p-4 bg-red-100 text-red-500">
                <ul class="list-disc px-3">
                    @for (error of validationErrors(); track error) {
                        <li>{{error}}</li>
                    }
                </ul>
            </div>
        }

        <button [disabled]="loading()" mat-flat-button type="submit" class="w-full py-2">
            {{loading() ? 'Registering...' : 'Register'}}
        </button>
    </form>
</mat-card>
