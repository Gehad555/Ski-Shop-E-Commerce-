@if (item(); as item) {
<div class="rounded-lg border border-gray-300 bg-[var(--mat-sys-surface)] p-4 shadow-sm mb-4">
    <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6">
        <div class="flex items-center gap-4 flex-1 min-w-0">
            <a routerLink="/shop/{{item.productId}}" class="shrink-0">
                <img class="h-20 w-20 object-contain rounded" src="{{item.pictureUrl}}" alt="product image">
            </a>
            <div class="flex-1 min-w-0 space-y-2">
                <a routerLink="/shop/{{item.productId}}" class="block text-base sm:text-xl font-semibold break-words">
                    {{item.productName}}
                </a>

                <div class="flex items-center gap-4">
                    <button 
                        [disabled]="cartService.loading()"
                        (click)="cartService.removeItemFromCart(item.productId, item.quantity)" 
                        mat-button class="delete-btn !text-red-600 hover:!bg-red-50"
                    >
                        <mat-icon class="!text-red-600">delete</mat-icon>
                        <span>Delete</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between sm:justify-end gap-4 sm:gap-6 pt-2 sm:pt-0 border-t sm:border-t-0 border-gray-100">
            <div class="flex items-center gap-2 sm:gap-3">
                <button [disabled]="cartService.loading()" mat-icon-button (click)="cartService.removeItemFromCart(item.productId)">
                    <mat-icon>remove</mat-icon>
                </button>

                <div class="font-semibold text-lg sm:text-xl min-w-[1.5rem] text-center">{{item.quantity}}</div>

                <button [disabled]="cartService.loading()" (click)="cartService.addItemToCart(item)" mat-icon-button>
                    <mat-icon>add</mat-icon>
                </button>
            </div>

            <div class="text-end sm:w-28">
                <p class="font-bold text-lg sm:text-xl">{{item.price * item.quantity | currency}}</p>
            </div>
        </div>
    </div>
</div>

}
