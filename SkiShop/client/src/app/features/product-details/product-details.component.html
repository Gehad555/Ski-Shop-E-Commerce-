  <div class="max-w-screen-2xl px-4 mx-auto">
    <div class="grid grid-cols-2 gap-8">

      <!-- Product Image -->
      <div class="max-w-xl mx-auto">
        <img
          [ngSrc]="product.pictureUrl"
          (error)="$any($event.target).src = '/images/placeholder.png'"
          alt="image of {{product.name}}"
          class="w-full rounded-xl"
          height="600"
          width="600"
          priority
          placeholder="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAAAAACH9iFYAAAACXBIWXMAAA7EAAAOxAGVKw4bAAACK0lEQVRIx4WVwXLaQBBEX68FQgjscuxbqvL/H5MPSTmJUwY72MLazmG1EgKhrIQOiHk7Mz3b6Dv9krqHhIQAARjAxvnhIYaC0RLqw9OVALZkrHxfA/TxOQUByMi2kMHoNIGJDIQkqWORUjDKiXscUUzuPyAALMtGjrpEFOP9YYiXcg02tk2ISryZEroVUgYSLOv1j2MXEqKMRoSJHuR4Sdys62XU5sW2I6CxBBclpM73SazqSs2fw329S9vjNClXSlBOACGFRV0X7dvhEx2q6j12TT4X4UyFHhLq7cofu8YSNG39EWISA80A8uSovN0GOFLX3YvVAz4+I8Q5YqqJ66/x79vdkpB/27aBIsjpYg4AwHt7+C2Oz2kSwLZ9H/rmjVIIEwDv1+nrujqd0POJuw5gH9YA1Wa7ALRkZk0Cmo8NwKfdApttCIw84FTLSQD7cgFufv5qTbkKj1usgeGZDNKp8atrMG2LtQGV6Uina6YEJ7pp32rsSPVYbQOgpbMacz1wd9ve3ZTY5V24LQEoI7aTuV09TFZnHbIOxwUu6qbfx5Y7xMwgWZ1dmN2DfXzKpmoM0SZelFEwIY9i2H+pvo2H/D3Fen6U09uo2Dzd6GTgjD9zCeM6LkrIb18GU+08EUcu+1CM4q3B9q3ee9wjLpU8LyETLFnWoG9PmFOB/rxnSU9VyC38XwY5bZHdxz0kd3HGUAzZuHMBfefdfeYHqfsjToHyGNHFn0L+AXZrXyoLBSlIAAAAAElFTkSuQmCC"
        />
      </div>

      <!-- Product Details -->
      <div class="mt-6 sm:mt-8 lg:mt-0">

        <h1 class="text-2xl font-semibold text-gray-900">
          {{product.name}}
        </h1>

        <div class="mt-4 items-center gap-4 flex">
          <p class="text-3xl font-extrabold text-gray-900">
            {{product.price | currency}}
          </p>
        </div>

        <!-- Add to Cart & Quantity -->
        <div class="flex gap-4 mt-6 items-center">
          <button 
            mat-flat-button 
            class="match-input-height"
            (click)="updateCart()"
            [disabled]="(quantity() === quantityInCart()) || cartService.loading()">
            <mat-icon>shopping_cart</mat-icon>
            {{getButtonText()}}
          </button>

          <mat-form-field
            appearance="outline"
            subscriptSizing="dynamic"
            class="w-36 quantity-field">

            <mat-label>Quantity</mat-label>
            <input
              matInput
              type="number"
              [(ngModel)]="quantity"
              min="1"
            >
          </mat-form-field>
        </div>

        @if (quantityInCart() > 0) {
          <p class="font-light text-sm mt-2">
            {{quantityInCart()}} already in your cart
          </p>
        }

        <!-- Divider -->
        <div class="mt-10 mb-6">
          <mat-divider></mat-divider>
        </div>

        <!-- Product Description -->
        <p class="text-gray-500 leading-relaxed">
          {{product.description}}
        </p>

      </div>
    </div>
  </div>
</section>
}
