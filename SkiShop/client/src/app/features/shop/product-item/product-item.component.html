@if (product) {
<mat-card appearance="raised" class="transition-shadow duration-300 cursor-pointer" routerLink="/shop/{{product.id}}">
    <img [src]="'/' + product.pictureUrl" (error)="$any($event.target).src = '/images/placeholder.png'" class="rounded-t-lg w-full object-cover" alt="image of {{product.name}}">
    <mat-card-content class="mt-2">
      <h2 class="text-sm font-semibold uppercase">{{product.name}}</h2>
      <p class="font-light">{{product.price | currency}}</p>
    </mat-card-content>
    <mat-card-actions (click)="$event.stopPropagation()">
      <button 
        mat-stroked-button class="w-full"
        (click)="cartService.addItemToCart(product)"
      >
        <mat-icon>add_shopping_cart</mat-icon>
        Add to cart
      </button>
    </mat-card-actions>
</mat-card>
}
