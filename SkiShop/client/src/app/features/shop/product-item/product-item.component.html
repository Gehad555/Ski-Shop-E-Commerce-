@if (product) {
<mat-card appearance="raised" class="!rounded-xl overflow-hidden hover:shadow-xl transition-shadow duration-300">
    <img src="{{product.pictureUrl}}" class="rounded-t-xl w-full object-cover" alt="image of {{product.name}}">
    <mat-card-content class="mt-3 px-4">
      <h2 class="text-sm font-semibold uppercase text-gray-800">{{product.name}}</h2>
      <p class="font-bold text-blue-600 text-lg mt-1">{{product.price | currency}}</p>
    </mat-card-content>
    <mat-card-actions class="!px-4 !pb-4">
      <button mat-flat-button class="w-full !bg-blue-600 !text-white !rounded-lg hover:!bg-blue-700">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to cart
      </button>
    </mat-card-actions>
</mat-card>
}
