<div class="flex flex-col gap-4 container p-4">
  <div class="flex justify-between items-center">
    <mat-paginator class="!bg-white !rounded-lg !shadow-sm" (page)="handlePageEvent($event)"
        [length]="products?.count" [pageSize]="shopParams.pageSize"
        [showFirstLastButtons]="true" [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="shopParams.pageNumber - 1" aria-label="select page">
    </mat-paginator>

    <form #searchForm="ngForm" 
        (ngSubmit)="onSearchChange()"
        class="relative flex items-center w-full max-w-md mx-4">
      <input 
          type="search"
          class="block w-full p-4 pr-12 text-sm text-gray-900 border border-gray-300 rounded-xl bg-white focus:border-blue-500 focus:ring-blue-500 shadow-sm outline-none"
          placeholder="Search products..." 
          name="search"
          (search)="onSearchChange()"
          [(ngModel)]="shopParams.search" />
      <button mat-icon-button type="submit"
          class="!absolute !right-2 !top-1/2 !-translate-y-1/2 flex items-center justify-center">
        <mat-icon class="text-blue-500">search</mat-icon>
      </button>
    </form>

    <div class="flex gap-3">
      <button class="match-input-height !rounded-lg !border-blue-600 !text-blue-600" mat-stroked-button (click)="openFiltersDialog()">
        <mat-icon>filter_list</mat-icon>
        Filters
      </button>
      <button class="match-input-height !rounded-lg !border-blue-600 !text-blue-600" mat-stroked-button [matMenuTriggerFor]="sortMenu">
        <mat-icon>swap_vert</mat-icon>
        Sort
      </button>
    </div>

  </div>

  <div class="grid grid-cols-5 gap-5">
    @for (product of products?.data; track product.id) {
    <app-product-item [product]="product"></app-product-item>
    }
  </div>
</div>

<mat-menu #sortMenu="matMenu">
  <mat-selection-list [multiple]="false" #sortList
      (selectionChange)="onSortChange($event)">
    @for (sort of sortOptions; track $index) {
    <mat-list-option [value]="sort.value"
        [selected]="shopParams.sort === sort.value">{{sort.name}}
    </mat-list-option>
    }
  </mat-selection-list>
</mat-menu>
