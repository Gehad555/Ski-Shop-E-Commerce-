<div class="w-full bg-white rounded-lg">
  <div class="border-b px-4 sm:px-6 py-4">
    <h3 class="text-xl sm:text-2xl font-bold text-center text-gray-800">Filters</h3>
  </div>
  <div class="flex flex-col sm:flex-row p-4 sm:p-6 gap-6 max-h-[65vh] overflow-y-auto">
    <div class="w-full sm:w-1/2">
      <h4 class="font-semibold text-lg text-blue-600 mb-2 flex items-center gap-2">
        <mat-icon class="text-blue-600">label</mat-icon>
        Brands
      </h4>
      <mat-divider></mat-divider>
      <mat-selection-list [(ngModel)]="selectedBrands" [multiple]="true" class="!mt-2">
        @for (brand of shopService.brands(); track brand) {
          <mat-list-option [value]="brand" class="!rounded-lg !mb-1">{{brand}}</mat-list-option>
        }
      </mat-selection-list>
    </div>
    <div class="w-full sm:w-1/2">
      <h4 class="font-semibold text-lg text-blue-600 mb-2 flex items-center gap-2">
        <mat-icon class="text-blue-600">category</mat-icon>
        Types
      </h4>
      <mat-divider></mat-divider>
      <mat-selection-list [(ngModel)]="selectedTypes" [multiple]="true" class="!mt-2">
        @for (type of shopService.types(); track type) {
          <mat-list-option [value]="type" class="!rounded-lg !mb-1">{{type}}</mat-list-option>
        }
      </mat-selection-list>
    </div>
  </div>
  <div class="flex justify-end px-4 sm:px-6 pb-4 pt-2 border-t border-gray-100">
    <button mat-flat-button (click)="applyFilters()" class="w-full sm:w-auto !bg-blue-600 !text-white !px-8 !py-2 !rounded-lg hover:!bg-blue-700 !text-base">
      Apply Filters
    </button>
  </div>
</div>
